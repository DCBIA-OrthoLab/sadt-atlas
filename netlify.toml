# ──────────────────────────────────────────────────────────────
#  Publication du site.
#
#  RIEN À CONSTRUIRE. Les pages générées par build.py sont
#  versionnées à dessein : un clone s'ouvre et fonctionne sans
#  rien exécuter, et le déploiement se contente de servir la
#  racine telle quelle.
#
#  Après édition d'une fiche, c'est `python3 build.py` EN LOCAL
#  qui régénère, puis on commite le résultat. Pas de build
#  distant : l'environnement de Netlify n'a pas à connaître
#  les générateurs.
# ──────────────────────────────────────────────────────────────

[build]
  publish = "."

# Aucune post-transformation. Le HTML, le SVG écrit à la main et
# les maillages .js sont calibrés ; une minification automatique
# n'apporterait rien et pourrait les abîmer.
[build.processing]
  skip_processing = true
